<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vahram Fly</title>
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:visible;
      background:transparent;
    }
    #flyHit{
      position:absolute;
      /* V99: smaller click mask.
         The iframe stays large so the fly is never cropped,
         but only this central area reacts to clicks. */
      left:18%;
      right:18%;
      top:14%;
      bottom:14%;
      cursor:pointer;
      background:transparent;
      z-index:2;
      border-radius:38%;
      clip-path:ellipse(50% 48% at 50% 50%);
      touch-action:manipulation;
    }
    #flyPlayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:1;
      opacity:1;
      visibility:visible;
      overflow:visible!important;
      clip-path:none!important;
      mask:none!important;
      -webkit-mask:none!important;
    }
    #flyPlayer canvas{
      background:transparent!important;
    }
  </style>
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.3.*/dist/iife/spine-player.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.3.*/dist/spine-player.css">

    <style>
      /* V13 Shadow patch:
         soft shadow behind the fly, not too dark, more transparent, smooth edges */
      html, body {
        overflow: visible !important;
      }
      #flyPlayer,
      canvas {
        filter:
          drop-shadow(16px 18px 18px rgba(0,0,0,0.16))
          drop-shadow(7px 8px 10px rgba(0,0,0,0.10))
          drop-shadow(2px 3px 4px rgba(0,0,0,0.06));
      }
    </style>

  
<style>
/* V98 — never clip/mask the Spine character inside its widget */
html, body,
#flyPlayer, #crocPlayer, #frogPlayer,
.spine-player, .spine-player-canvas, canvas {
  overflow: visible !important;
  clip-path: none !important;
  mask: none !important;
  -webkit-mask: none !important;
  contain: none !important;
}
canvas {
  max-width: none !important;
  max-height: none !important;
}
</style>

</head>
<body>
  <div id="flyPlayer"></div>
  <div id="flyHit" aria-label="Interactive fly"></div>

  <script>
    let playerRef = null;
    let ready = false;
    let firing = false;

    // Remember the exact animation requested by the page.
    let requestedLoop = 'flies';

    function parentMessage(type){
      try{
        parent.postMessage({source:'vahram-fly-v4',type}, '*');
      }catch(_){}
    }

    function applyRequestedLoop(){
      if(!ready || firing) return;
      try{
        playerRef.animationState.setAnimation(0, requestedLoop, true);
      }catch(e){
        console.error('Unable to play Spine animation:', requestedLoop, e);
      }
    }

    function requestLoop(name){
      if(name !== 'flies' && name !== 'flies_Run') return;
      requestedLoop = name;
      applyRequestedLoop();
    }

    function fire(){
      if(!ready || firing) return;

      firing = true;
      try{
        playerRef.animationState.setAnimation(0, 'fire', false);

        // After fire, return to whatever movement mode is currently active.
        playerRef.animationState.addAnimation(0, requestedLoop, true, 0);
      }catch(e){
        console.error('Unable to play fire animation:', e);
      }

      parentMessage('fire');

      setTimeout(()=>{
        firing = false;
        applyRequestedLoop();
      },1350);
    }

    new spine.SpinePlayer('flyPlayer',{
      skeleton:'assets/spine/fly-new/jeko_spine_final.json',
      atlas:'assets/spine/fly-new/jeko_spine_final.atlas',
      animation:'flies',
      showControls:false,
      alpha:true,
      premultipliedAlpha:true,
      backgroundColor:'#00000000',
      defaultMix:0.10,
      viewport:{
        /* V3: fly artwork ~20% larger; stage, hitbox and movement stay unchanged. */
        x:-1930.1961,
        y:-398.0684,
        width:2673.3878,
        height:1276.1736,
        padLeft:0,
        padRight:0,
        padTop:0,
        padBottom:0
      },
      success(player){
        playerRef = player;
        ready = true;
        applyRequestedLoop();
        parentMessage('ready');
      },
      error(player, reason){
        console.error('Spine fly error:', reason);
      }
    });

    window.addEventListener('message', (event)=>{
      const data = event.data || {};
      if(data.source !== 'vahram-site-v4') return;

      // NEW: exact animation names from parent.
      if(data.type === 'flies') requestLoop('flies');
      if(data.type === 'flies_Run') requestLoop('flies_Run');

      // Backward compatibility with older page commands.
      if(data.type === 'idle') requestLoop('flies');
      if(data.type === 'run') requestLoop('flies_Run');

      if(data.type === 'fire') fire();
    });

    const hit = document.getElementById('flyHit');

    // Hover no longer changes the movement animation.
    // The animation is controlled ONLY by slow/fast movement state.
    hit.addEventListener('pointerdown', (e)=>{
      if(e.isPrimary === false) return;
      if(typeof e.button === 'number' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      fire();
    });
  </script>
</body>
</html>
