<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spine Characters Test</title>
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.3.13/dist/spine-player.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14;font-family:Inter,Arial,sans-serif;color:#fff}
    body{
      background:
        radial-gradient(circle at 50% 35%,#1a2634 0,#0d141d 38%,#080b10 78%),
        #080b10;
    }

    /* ===== compact top controls ===== */
    .controls{
      position:fixed;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      z-index:100;
      display:flex;
      align-items:center;
      gap:6px;
      padding:5px;
      border:1px solid #3d4b5d;
      border-radius:18px;
      background:#121923eF;
      box-shadow:0 12px 35px #000b, inset 0 0 0 1px #ffffff08;
      backdrop-filter:blur(14px);
    }
    .master{
      display:flex;align-items:center;gap:5px;
      padding:0 7px 0 5px;
      border-right:1px solid #334052;
      height:42px;
    }
    .bolt{font-size:18px;filter:drop-shadow(0 0 8px #ff9d28)}
    .card{position:relative}
    .head{
      height:42px;
      min-width:118px;
      display:flex;
      align-items:center;
      gap:6px;
      padding:3px 6px;
      border:1px solid #334052;
      border-radius:12px;
      background:linear-gradient(#1a2330,#101720);
    }
    .avatar{
      width:34px;height:34px;border-radius:10px;
      display:grid;place-items:center;
      font-size:21px;
      background:#0d151f;
      border:2px solid #f4a73c;
      box-shadow:0 0 14px #ff9c3133;
    }
    .name{font-weight:800;font-size:12px;line-height:1}
    .sub{font-size:8px;color:#8696ab;margin-top:3px}
    .fold{
      width:18px;height:24px;padding:0;border:0;background:transparent;color:#b8c2d0;
      font-size:15px;cursor:pointer;
    }
    .switch{position:relative;width:36px;height:20px;display:inline-block;margin-left:auto}
    .switch input{display:none}
    .track{
      position:absolute;inset:0;border-radius:999px;
      background:#8e1823;border:1px solid #ff4051;
      box-shadow:0 0 10px #ff243b88,inset 0 0 7px #ff304166;
      transition:.18s;
    }
    .knob{
      position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;
      background:#fff3d8;box-shadow:0 1px 4px #0008;
      transition:.18s;
    }
    .switch input:checked + .track{
      background:#087b40;border-color:#2dff86;
      box-shadow:0 0 12px #25ff7faa,inset 0 0 8px #42ff9177;
    }
    .switch input:checked + .track .knob{transform:translateX(16px)}
    .menu{
      display:none;
      position:absolute;
      top:48px;left:0;
      min-width:165px;
      padding:7px;
      border:1px solid #405066;
      border-radius:12px;
      background:#111923f7;
      box-shadow:0 20px 40px #000c;
    }
    .card.open .menu{display:grid;gap:4px}
    .anim{
      border:1px solid #273346;
      border-radius:8px;
      background:#18212d;color:#dbe4ef;
      padding:7px 9px;text-align:left;font-size:11px;cursor:pointer;
    }
    .anim:hover,.anim.active{border-color:#f3a63c;color:#fff;background:#2a2218}

    /* ===== full-screen character stage ===== */
    #stage{position:fixed;inset:0;overflow:hidden;pointer-events:none}
    .actor{position:absolute;opacity:0;transition:opacity .22s;pointer-events:none}
    .actor.on{opacity:1}

    .spine-host{width:100%;height:100%;background:transparent!important}
    .spine-player-canvas{background:transparent!important}

    /* Fly: free viewport roaming. Real Spine animation stays inside. */
    #flyLane{
      position:absolute;
      left:12vw;
      top:22vh;
      width:260px;
      height:205px;
      opacity:0;
      pointer-events:none;
      will-change:left,top,transform;
      transition:left 1.7s ease-in-out, top 1.7s ease-in-out, transform .2s ease;
    }
    #flyLane.on{opacity:1}
    #flyBob{
      width:100%;height:100%;
      pointer-events:auto;
      cursor:crosshair;
      transform-origin:center;
      animation:flyBob 1.15s ease-in-out infinite alternate;
    }
    @keyframes flyBob{
      from{transform:translateY(-22px) rotate(-2deg) scaleX(var(--flyFace,-1))}
      to{transform:translateY(26px) rotate(2deg) scaleX(var(--flyFace,-1))}
    }
    .click-label{
      position:absolute;left:50%;top:3px;transform:translateX(-50%);
      font-size:10px;font-weight:900;letter-spacing:.08em;
      color:#ffd27a;text-shadow:0 2px 8px #000;
      opacity:.78;pointer-events:none;
    }

    /* Frog: larger and closer to the center-bottom. */
    /* Frog fixed bottom-right */
    #frogActor{
      left:50%;
      right:auto;
      bottom:-1.8vw;
      width:min(820px,56vw);
      height:min(650px,45vw);
      transform:translateX(-50%);
      transform-origin:50% 100%;
    }

    /* Croc moves horizontally across bottom */
    #crocActor{
      left:-48vw;bottom:-2.5vw;
      width:min(760px,48vw);height:min(500px,34vw);
      will-change:left,transform;
    }
    #crocActor.reverse{transform:scaleX(-1)}
    #crocActor.forward{transform:scaleX(1)}
    #crocActor{
      transition:left 4.9s cubic-bezier(.22,.61,.36,1), transform .28s ease, opacity .22s ease;
    }
    .actor.rig-focus,
    #flyLane.rig-focus{
      position:fixed!important;
      left:50%!important;
      top:50%!important;
      right:auto!important;
      bottom:auto!important;
      width:min(1180px,88vw)!important;
      height:min(900px,82vh)!important;
      transform:translate(-50%,-50%)!important;
      z-index:80!important;
      opacity:1!important;
      transition:transform .28s ease, opacity .2s ease!important;
    }
    #flyLane.rig-focus #flyBob{
      animation:none!important;
      transform:none!important;
    }
    .rig-backdrop{
      position:fixed;
      inset:0;
      background:radial-gradient(circle at 50% 45%,#263548d8 0,#0a0f16ef 65%,#05070af5 100%);
      opacity:0;
      pointer-events:none;
      transition:.2s;
      z-index:70;
    }
    .rig-backdrop.on{opacity:1}
    .rig-label{
      position:fixed;
      z-index:85;
      left:50%;
      top:78px;
      transform:translateX(-50%);
      padding:8px 14px;
      border-radius:999px;
      background:#111923e8;
      border:1px solid #51627a;
      font-size:12px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:0;
      pointer-events:none;
    }
    .rig-label.on{opacity:1}


    .hint{
      position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
      color:#7f8c9f;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      pointer-events:none;
    }

    @media(max-width:850px){
      .controls{left:8px;right:8px;transform:none;justify-content:center;gap:3px}
      .head{min-width:88px;padding:3px}
      .name,.sub{display:none}
      .avatar{width:32px;height:32px}
      #frogActor{width:92vw;height:72vw;left:50%;right:auto;bottom:-3vw;transform:translateX(-50%)}
      #crocActor{width:110vw;height:75vw;bottom:-5vw}
      #flyLane{width:220px;height:175px;top:30%}
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="master">
      <span class="bolt">⚡</span>
      <label class="switch" title="Все персонажи">
        <input id="allToggle" type="checkbox">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>

    <div class="card" data-key="fly">
      <div class="head">
        <div class="avatar">🪰</div>
        <div><div class="name">Муха</div><div class="sub">interactive</div></div>
        <label class="switch">
          <input class="toggle" type="checkbox">
          <span class="track"><span class="knob"></span></span>
        </label>
        <button class="fold">⌄</button>
      </div>
      <div class="menu">
        <button class="anim active" data-mode="auto">▶ Auto</button>
        <button class="anim" data-mode="flies">▶ flies</button>
        <button class="anim" data-mode="flies_Run">▶ flies_Run</button>
        <button class="anim" data-mode="fire">▶ fire</button>
        <button class="anim" data-mode="Rig_View">▶ Rig View</button>
      </div>
    </div>

    <div class="card" data-key="croc">
      <div class="head">
        <div class="avatar">🐊</div>
        <div><div class="name">Крокодил</div><div class="sub">running</div></div>
        <label class="switch">
          <input class="toggle" type="checkbox">
          <span class="track"><span class="knob"></span></span>
        </label>
        <button class="fold">⌄</button>
      </div>
      <div class="menu">
        <button class="anim active" data-mode="auto">▶ Auto</button>
        <button class="anim" data-mode="running">▶ running</button>
        <button class="anim" data-mode="Happy_1">▶ Happy_1</button>
        <button class="anim" data-mode="Happy_2">▶ Happy_2</button>
        <button class="anim" data-mode="start">▶ start</button>
        <button class="anim" data-mode="Rig_View">▶ Rig View</button>
      </div>
    </div>

    <div class="card" data-key="frog">
      <div class="head">
        <div class="avatar">🐸</div>
        <div><div class="name">Лягушка</div><div class="sub">fire</div></div>
        <label class="switch">
          <input class="toggle" type="checkbox">
          <span class="track"><span class="knob"></span></span>
        </label>
        <button class="fold">⌄</button>
      </div>
      <div class="menu">
        <button class="anim active" data-mode="fire">▶ fire</button>
        <button class="anim" data-mode="Rig_View">▶ Rig View</button>
      </div>
    </div>
  </div>

  <div id="rigBackdrop" class="rig-backdrop"></div><div id="rigLabel" class="rig-label">Rig View</div>
  <div id="stage">
    <div id="flyLane">
      <div id="flyBob">
        <div id="flyPlayer" class="spine-host"></div>
        <div class="click-label">CLICK → FIRE</div>
      </div>
    </div>

    <div id="frogActor" class="actor">
      <div id="frogPlayer" class="spine-host"></div>
    </div>

    <div id="crocActor" class="actor">
      <div id="crocPlayer" class="spine-host"></div>
    </div>
  </div>

  <div class="hint">Тест персонажей · без сайта</div>

  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.3.13/dist/iife/spine-player.min.js"></script>
  <script>
    const refs={fly:null,frog:null,croc:null};
    const ready={fly:false,frog:false,croc:false};
    const flyLane=document.getElementById('flyLane');
    const flyBob=document.getElementById('flyBob');
    const frogActor=document.getElementById('frogActor');
    const crocActor=document.getElementById('crocActor');
    const allToggle=document.getElementById('allToggle');
    let flyMode='auto';
    let crocToken=0;
    let flyMoveTimer=null;
    let flyMoveToken=0;
    const rigBackdrop=document.getElementById('rigBackdrop');
    const rigLabel=document.getElementById('rigLabel');

    function createPlayer(key,id,skeleton,atlas,animation){
      return new spine.SpinePlayer(id,{
        skeleton,atlas,animation,
        showControls:false,alpha:true,premultipliedAlpha:true,
        backgroundColor:'#00000000',
        defaultMix:0.22,
        success(player){
          refs[key]=player;ready[key]=true;
          if(key==='fly') player.animationState.setAnimation(0,'flies',true);
        },
        error(player,reason){console.error(key,reason)}
      });
    }

    createPlayer('fly','flyPlayer',
      'assets/spine/fly/jeko_spine_final.json',
      'assets/spine/fly/jeko_spine_final.atlas','flies');

    createPlayer('frog','frogPlayer',
      'assets/spine/frog/Amb+gort spine.json',
      'assets/spine/frog/Amb+gort spine.atlas','fire');

    createPlayer('croc','crocPlayer',
      'assets/spine/croc/kroks spine fayl.json',
      'assets/spine/croc/kroks spine fayl.atlas','running');

    const cards=[...document.querySelectorAll('.card')];

    function cardFor(key){return document.querySelector(`.card[data-key="${key}"]`)}
    function enabled(key){return cardFor(key).querySelector('.toggle').checked}

    cards.forEach(card=>{
      const key=card.dataset.key;
      const fold=card.querySelector('.fold');
      const toggle=card.querySelector('.toggle');

      fold.addEventListener('click',e=>{
        e.stopPropagation();
        const open=card.classList.contains('open');
        cards.forEach(c=>c.classList.remove('open'));
        if(!open) card.classList.add('open');
      });

      toggle.addEventListener('change',()=>{
        setEnabled(key,toggle.checked);
        syncMaster();
      });

      card.querySelectorAll('.anim').forEach(btn=>{
        btn.addEventListener('click',()=>{
          card.querySelectorAll('.anim').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          if(!toggle.checked){toggle.checked=true;setEnabled(key,true)}
          playMode(key,btn.dataset.mode);
          syncMaster();
        });
      });
    });

    document.addEventListener('pointerdown',e=>{
      if(!e.target.closest('.controls')) cards.forEach(c=>c.classList.remove('open'));
    });

    allToggle.addEventListener('change',()=>{
      cards.forEach(card=>{
        const t=card.querySelector('.toggle');
        t.checked=allToggle.checked;
        setEnabled(card.dataset.key,t.checked);
      });
    });

    function syncMaster(){
      const values=cards.map(c=>c.querySelector('.toggle').checked);
      allToggle.checked=values.every(Boolean);
      allToggle.indeterminate=values.some(Boolean)&&!values.every(Boolean);
    }

    function setEnabled(key,on){
      if(key==='fly'){
        flyLane.classList.toggle('on',on);
        if(on) setFly('auto');
        else{
          flyMoveToken++;
          clearTimeout(flyMoveTimer);
          clearRigFocus('fly');
        }
      }
      if(key==='frog'){
        frogActor.classList.toggle('on',on);
        if(on&&ready.frog) refs.frog.setAnimation('fire',false);
        if(!on) clearRigFocus('frog');
      }
      if(key==='croc'){
        crocActor.classList.toggle('on',on);
        if(on){
          clearRigFocus('croc');
          startCroc();
        }else{
          crocToken++;
          clearRigFocus('croc');
        }
      }
    }

    function playMode(key,mode){
      if(key==='fly') setFly(mode);
      if(key==='frog'&&ready.frog){
        frogActor.classList.add('on');
        if(mode==='Rig_View'){
          setRigFocus('frog');
          refs.frog.setAnimation('Rig_View',false);
        }else{
          clearRigFocus('frog');
          refs.frog.setAnimation(mode,false);
        }
      }
      if(key==='croc'&&ready.croc){
        crocToken++;
        crocActor.classList.add('on');
        crocActor.classList.remove('reverse','forward');
        if(mode==='Rig_View'){
          setRigFocus('croc');
          refs.croc.setAnimation('Rig_View',false);
        }else{
          clearRigFocus('croc');
          refs.croc.setAnimation(mode,mode==='running');
        }
      }
    }

    /* Fly: free random roaming across the viewport.
       The container changes direction; the real Spine animation remains untouched. */
    function randomFlyTarget(){
      const w=Math.max(220,flyLane.offsetWidth||260);
      const h=Math.max(170,flyLane.offsetHeight||205);
      const padX=24;
      const topPad=82;
      const bottomPad=28;
      return {
        x:padX+Math.random()*Math.max(40,innerWidth-w-padX*2),
        y:topPad+Math.random()*Math.max(40,innerHeight-h-topPad-bottomPad)
      };
    }

    function scheduleFlyRoam(){
      const token=++flyMoveToken;

      const step=()=>{
        if(token!==flyMoveToken || !enabled('fly') || flyMode!=='auto') return;

        const currentX=parseFloat(flyLane.style.left)||flyLane.getBoundingClientRect().left;
        const target=randomFlyTarget();
        const goingRight=target.x>=currentX;

        // Source fly faces the opposite way, so flip based on travel direction.
        flyBob.style.transformOrigin='center';
        flyBob.style.setProperty('--flyFace',goingRight ? '-1' : '1');

        const dist=Math.hypot(target.x-currentX,target.y-(parseFloat(flyLane.style.top)||flyLane.getBoundingClientRect().top));
        const fast=dist>innerWidth*.45 && Math.random()>.35;
        const duration=fast ? 1.05+Math.random()*.55 : 1.55+Math.random()*1.0;

        if(ready.fly){
          refs.fly.setAnimation(fast?'flies_Run':'flies',true);
        }

        flyLane.style.transition=`left ${duration}s ease-in-out, top ${duration}s ease-in-out`;
        flyLane.style.left=target.x+'px';
        flyLane.style.top=target.y+'px';

        flyMoveTimer=setTimeout(step,duration*1000+300+Math.random()*700);
      };

      step();
    }

    function setFly(mode){
      flyMode=mode;
      flyMoveToken++;
      clearTimeout(flyMoveTimer);
      clearRigFocus('fly');

      if(!ready.fly) return;
      flyLane.classList.add('on');

      if(mode==='auto'){
        refs.fly.setAnimation('flies',true);
        scheduleFlyRoam();
      }else if(mode==='flies'){
        refs.fly.setAnimation('flies',true);
      }else if(mode==='flies_Run'){
        refs.fly.setAnimation('flies_Run',true);
      }else if(mode==='Rig_View'){
        refs.fly.setAnimation('Rig_View',false);
        setRigFocus('fly');
      }else{
        refs.fly.setAnimation(mode,false);
      }
    }

    flyBob.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      if(!enabled('fly')||!ready.fly||flyMode==='Rig_View') return;

      const previous=flyMode;
      flyMoveToken++;
      clearTimeout(flyMoveTimer);
      refs.fly.setAnimation('fire',false);

      setTimeout(()=>{
        if(!enabled('fly')) return;
        if(previous==='auto'){
          flyMode='auto';
          refs.fly.setAnimation('flies',true);
          scheduleFlyRoam();
        }else{
          refs.fly.setAnimation(previous,previous==='flies'||previous==='flies_Run');
        }
      },900);
    });

    function clearAllRigFocus(){
      flyLane.classList.remove('rig-focus');
      frogActor.classList.remove('rig-focus');
      crocActor.classList.remove('rig-focus');
      rigBackdrop.classList.remove('on');
      rigLabel.classList.remove('on');
    }

    function clearRigFocus(key){
      const el=key==='fly'?flyLane:(key==='frog'?frogActor:crocActor);
      el.classList.remove('rig-focus');
      if(!document.querySelector('.rig-focus')){
        rigBackdrop.classList.remove('on');
        rigLabel.classList.remove('on');
      }
    }

    function setRigFocus(key){
      clearAllRigFocus();
      const el=key==='fly'?flyLane:(key==='frog'?frogActor:crocActor);
      el.classList.add('rig-focus');
      rigBackdrop.classList.add('on');
      rigLabel.classList.add('on');
    }

    function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
    function once(player,name){
      return new Promise(resolve=>{
        const entry=player.animationState.setAnimation(0,name,false);
        entry.listener={complete:resolve};
      });
    }

    async function startCroc(){
      if(!ready.croc) return;

      const token=++crocToken;
      crocActor.classList.add('on');
      clearRigFocus('croc');

      const width=Math.max(520,crocActor.getBoundingClientRect().width);
      const left=-width*.72;
      const right=innerWidth-width*.40;

      async function travel(direction){
        if(token!==crocToken||!enabled('croc')) return false;

        const goingRight = direction==='right';

        // Correct facing for the actual exported crocodile artwork.
        crocActor.classList.toggle('forward', goingRight);
        crocActor.classList.toggle('reverse', !goingRight);

        // The real Spine running animation keeps playing for the entire travel.
        refs.croc.setAnimation('running',true);

        crocActor.style.transition='none';
        crocActor.style.left=(goingRight?left:right)+'px';
        void crocActor.offsetWidth;

        // Main travel with smooth acceleration/deceleration instead of a hard linear stop.
        crocActor.style.transition='left 4.75s cubic-bezier(.22,.61,.36,1), transform .28s ease, opacity .22s ease';
        crocActor.style.left=(goingRight?right:left)+'px';

        await sleep(4750);
        if(token!==crocToken||!enabled('croc')) return false;

        // Tiny "settle" so the character does not snap into the next animation.
        crocActor.style.transition='transform .22s ease';
        await sleep(140);

        return token===crocToken && enabled('croc');
      }

      while(token===crocToken && enabled('croc')){
        // Left -> right
        if(!(await travel('right'))) break;

        // Smoothly switch only after travel is fully complete.
        await once(refs.croc,Math.random()>.5?'Happy_1':'Happy_2');
        if(token!==crocToken||!enabled('croc')) break;

        await sleep(180);

        // Right -> left
        if(!(await travel('left'))) break;

        await once(refs.croc,Math.random()>.5?'Happy_1':'Happy_2');
        if(token!==crocToken||!enabled('croc')) break;

        await sleep(180);

        // Per your rule: start is the last animation in the cycle.
        crocActor.classList.remove('forward');
        crocActor.classList.add('reverse');
        await once(refs.croc,'start');
        if(token!==crocToken||!enabled('croc')) break;

        await sleep(220);
      }
    }
  </script>
</body>
</html>
