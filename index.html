<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spine Characters Test</title>
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.3.13/dist/spine-player.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14;font-family:Inter,Arial,sans-serif;color:#fff}
    body{
      background:
        radial-gradient(circle at 50% 35%,#1a2634 0,#0d141d 38%,#080b10 78%),
        #080b10;
    }

    /* ===== compact top controls ===== */
    .controls{
      position:fixed;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      z-index:100;
      display:flex;
      align-items:center;
      gap:6px;
      padding:5px;
      border:1px solid #3d4b5d;
      border-radius:18px;
      background:#121923eF;
      box-shadow:0 12px 35px #000b, inset 0 0 0 1px #ffffff08;
      backdrop-filter:blur(14px);
    }
    .master{
      display:flex;align-items:center;gap:5px;
      padding:0 7px 0 5px;
      border-right:1px solid #334052;
      height:42px;
    }
    .bolt{font-size:18px;filter:drop-shadow(0 0 8px #ff9d28)}
    .card{position:relative}
    .head{
      height:42px;
      min-width:118px;
      display:flex;
      align-items:center;
      gap:6px;
      padding:3px 6px;
      border:1px solid #334052;
      border-radius:12px;
      background:linear-gradient(#1a2330,#101720);
    }
    .avatar{
      width:34px;height:34px;border-radius:10px;
      display:grid;place-items:center;
      font-size:21px;
      background:#0d151f;
      border:2px solid #f4a73c;
      box-shadow:0 0 14px #ff9c3133;
    }
    .name{font-weight:800;font-size:12px;line-height:1}
    .sub{font-size:8px;color:#8696ab;margin-top:3px}
    .fold{
      width:18px;height:24px;padding:0;border:0;background:transparent;color:#b8c2d0;
      font-size:15px;cursor:pointer;
    }
    .switch{position:relative;width:36px;height:20px;display:inline-block;margin-left:auto}
    .switch input{display:none}
    .track{
      position:absolute;inset:0;border-radius:999px;
      background:#8e1823;border:1px solid #ff4051;
      box-shadow:0 0 10px #ff243b88,inset 0 0 7px #ff304166;
      transition:.18s;
    }
    .knob{
      position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;
      background:#fff3d8;box-shadow:0 1px 4px #0008;
      transition:.18s;
    }
    .switch input:checked + .track{
      background:#087b40;border-color:#2dff86;
      box-shadow:0 0 12px #25ff7faa,inset 0 0 8px #42ff9177;
    }
    .switch input:checked + .track .knob{transform:translateX(16px)}
    .menu{
      display:none;
      position:absolute;
      top:48px;left:0;
      min-width:165px;
      padding:7px;
      border:1px solid #405066;
      border-radius:12px;
      background:#111923f7;
      box-shadow:0 20px 40px #000c;
    }
    .card.open .menu{display:grid;gap:4px}
    .anim{
      border:1px solid #273346;
      border-radius:8px;
      background:#18212d;color:#dbe4ef;
      padding:7px 9px;text-align:left;font-size:11px;cursor:pointer;
    }
    .anim:hover,.anim.active{border-color:#f3a63c;color:#fff;background:#2a2218}

    /* ===== full-screen character stage ===== */
    #stage{position:fixed;inset:0;overflow:hidden;pointer-events:none}
    .actor{position:absolute;opacity:0;transition:opacity .22s;pointer-events:none}
    .actor.on{opacity:1}

    .spine-host{width:100%;height:100%;background:transparent!important}
    .spine-player-canvas{background:transparent!important}

    /* Fly: left -> right only. Inner wrapper bobs vertically. */
    #flyLane{
      position:absolute;
      left:-280px;
      top:34%;
      width:250px;
      height:200px;
      opacity:0;
      pointer-events:none;
      will-change:transform;
    }
    #flyLane.on{opacity:1}
    #flyBob{
      width:100%;height:100%;
      pointer-events:auto;
      cursor:crosshair;
      animation:flyBob 1.25s ease-in-out infinite alternate;
      transform-origin:center;
    }
    #flyLane.flying{
      animation:flyAcross 7.8s linear infinite;
    }
    #flyLane.fast{
      animation-duration:4.8s;
    }
    @keyframes flyAcross{
      from{transform:translateX(0)}
      to{transform:translateX(calc(100vw + 560px))}
    }
    @keyframes flyBob{
      from{transform:translateY(-28px) rotate(-2deg)}
      to{transform:translateY(30px) rotate(2deg)}
    }
    .click-label{
      position:absolute;left:50%;top:3px;transform:translateX(-50%);
      font-size:10px;font-weight:900;letter-spacing:.08em;
      color:#ffd27a;text-shadow:0 2px 8px #000;
      opacity:.78;pointer-events:none;
    }

    /* Frog fixed bottom-right */
    #frogActor{
      right:2vw;bottom:-2.5vw;
      width:min(650px,43vw);height:min(520px,36vw);
    }

    /* Croc moves horizontally across bottom */
    #crocActor{
      left:-48vw;bottom:-2.5vw;
      width:min(760px,48vw);height:min(500px,34vw);
      will-change:left,transform;
    }
    #crocActor.reverse{transform:scaleX(-1)}

    .hint{
      position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
      color:#7f8c9f;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      pointer-events:none;
    }

    @media(max-width:850px){
      .controls{left:8px;right:8px;transform:none;justify-content:center;gap:3px}
      .head{min-width:88px;padding:3px}
      .name,.sub{display:none}
      .avatar{width:32px;height:32px}
      #frogActor{width:86vw;height:68vw;right:-8vw;bottom:-4vw}
      #crocActor{width:110vw;height:75vw;bottom:-5vw}
      #flyLane{width:220px;height:175px;top:30%}
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="master">
      <span class="bolt">⚡</span>
      <label class="switch" title="Все персонажи">
        <input id="allToggle" type="checkbox">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>

    <div class="card" data-key="fly">
      <div class="head">
        <div class="avatar">🪰</div>
        <div><div class="name">Муха</div><div class="sub">interactive</div></div>
        <label class="switch">
          <input class="toggle" type="checkbox">
          <span class="track"><span class="knob"></span></span>
        </label>
        <button class="fold">⌄</button>
      </div>
      <div class="menu">
        <button class="anim active" data-mode="auto">▶ Auto</button>
        <button class="anim" data-mode="flies">▶ flies</button>
        <button class="anim" data-mode="flies_Run">▶ flies_Run</button>
        <button class="anim" data-mode="fire">▶ fire</button>
        <button class="anim" data-mode="Rig_View">▶ Rig View</button>
      </div>
    </div>

    <div class="card" data-key="croc">
      <div class="head">
        <div class="avatar">🐊</div>
        <div><div class="name">Крокодил</div><div class="sub">running</div></div>
        <label class="switch">
          <input class="toggle" type="checkbox">
          <span class="track"><span class="knob"></span></span>
        </label>
        <button class="fold">⌄</button>
      </div>
      <div class="menu">
        <button class="anim active" data-mode="auto">▶ Auto</button>
        <button class="anim" data-mode="running">▶ running</button>
        <button class="anim" data-mode="Happy_1">▶ Happy_1</button>
        <button class="anim" data-mode="Happy_2">▶ Happy_2</button>
        <button class="anim" data-mode="start">▶ start</button>
        <button class="anim" data-mode="Rig_View">▶ Rig View</button>
      </div>
    </div>

    <div class="card" data-key="frog">
      <div class="head">
        <div class="avatar">🐸</div>
        <div><div class="name">Лягушка</div><div class="sub">fire</div></div>
        <label class="switch">
          <input class="toggle" type="checkbox">
          <span class="track"><span class="knob"></span></span>
        </label>
        <button class="fold">⌄</button>
      </div>
      <div class="menu">
        <button class="anim active" data-mode="fire">▶ fire</button>
        <button class="anim" data-mode="Rig_View">▶ Rig View</button>
      </div>
    </div>
  </div>

  <div id="stage">
    <div id="flyLane">
      <div id="flyBob">
        <div id="flyPlayer" class="spine-host"></div>
        <div class="click-label">CLICK → FIRE</div>
      </div>
    </div>

    <div id="frogActor" class="actor">
      <div id="frogPlayer" class="spine-host"></div>
    </div>

    <div id="crocActor" class="actor">
      <div id="crocPlayer" class="spine-host"></div>
    </div>
  </div>

  <div class="hint">Тест персонажей · без сайта</div>

  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.3.13/dist/iife/spine-player.min.js"></script>
  <script>
    const refs={fly:null,frog:null,croc:null};
    const ready={fly:false,frog:false,croc:false};
    const flyLane=document.getElementById('flyLane');
    const flyBob=document.getElementById('flyBob');
    const frogActor=document.getElementById('frogActor');
    const crocActor=document.getElementById('crocActor');
    const allToggle=document.getElementById('allToggle');
    let flyMode='auto';
    let crocToken=0;

    function createPlayer(key,id,skeleton,atlas,animation){
      return new spine.SpinePlayer(id,{
        skeleton,atlas,animation,
        showControls:false,alpha:true,premultipliedAlpha:true,
        backgroundColor:'#00000000',
        success(player){
          refs[key]=player;ready[key]=true;
          if(key==='fly') player.animationState.setAnimation(0,'flies',true);
        },
        error(player,reason){console.error(key,reason)}
      });
    }

    createPlayer('fly','flyPlayer',
      'assets/spine/fly/jeko_spine_final.json',
      'assets/spine/fly/jeko_spine_final.atlas','flies');

    createPlayer('frog','frogPlayer',
      'assets/spine/frog/Amb+gort spine.json',
      'assets/spine/frog/Amb+gort spine.atlas','fire');

    createPlayer('croc','crocPlayer',
      'assets/spine/croc/kroks spine fayl.json',
      'assets/spine/croc/kroks spine fayl.atlas','running');

    const cards=[...document.querySelectorAll('.card')];

    function cardFor(key){return document.querySelector(`.card[data-key="${key}"]`)}
    function enabled(key){return cardFor(key).querySelector('.toggle').checked}

    cards.forEach(card=>{
      const key=card.dataset.key;
      const fold=card.querySelector('.fold');
      const toggle=card.querySelector('.toggle');

      fold.addEventListener('click',e=>{
        e.stopPropagation();
        const open=card.classList.contains('open');
        cards.forEach(c=>c.classList.remove('open'));
        if(!open) card.classList.add('open');
      });

      toggle.addEventListener('change',()=>{
        setEnabled(key,toggle.checked);
        syncMaster();
      });

      card.querySelectorAll('.anim').forEach(btn=>{
        btn.addEventListener('click',()=>{
          card.querySelectorAll('.anim').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          if(!toggle.checked){toggle.checked=true;setEnabled(key,true)}
          playMode(key,btn.dataset.mode);
          syncMaster();
        });
      });
    });

    document.addEventListener('pointerdown',e=>{
      if(!e.target.closest('.controls')) cards.forEach(c=>c.classList.remove('open'));
    });

    allToggle.addEventListener('change',()=>{
      cards.forEach(card=>{
        const t=card.querySelector('.toggle');
        t.checked=allToggle.checked;
        setEnabled(card.dataset.key,t.checked);
      });
    });

    function syncMaster(){
      const values=cards.map(c=>c.querySelector('.toggle').checked);
      allToggle.checked=values.every(Boolean);
      allToggle.indeterminate=values.some(Boolean)&&!values.every(Boolean);
    }

    function setEnabled(key,on){
      if(key==='fly'){
        flyLane.classList.toggle('on',on);
        if(on) setFly('auto'); else flyLane.classList.remove('flying','fast');
      }
      if(key==='frog'){
        frogActor.classList.toggle('on',on);
        if(on&&ready.frog) refs.frog.setAnimation('fire',false);
      }
      if(key==='croc'){
        crocActor.classList.toggle('on',on);
        if(on) startCroc(); else crocToken++;
      }
    }

    function playMode(key,mode){
      if(key==='fly') setFly(mode);
      if(key==='frog'&&ready.frog){
        frogActor.classList.add('on');
        refs.frog.setAnimation(mode,false);
      }
      if(key==='croc'&&ready.croc){
        crocToken++;
        crocActor.classList.add('on');
        crocActor.classList.remove('reverse');
        refs.croc.setAnimation(mode,mode==='running');
      }
    }

    /* Fly: ONLY left -> right across screen + gentle vertical bobbing.
       No random teleporting and no random 2D directions. */
    function setFly(mode){
      flyMode=mode;
      if(!ready.fly) return;
      flyLane.classList.add('on');
      flyLane.classList.remove('flying','fast');

      if(mode==='auto'){
        refs.fly.setAnimation('flies',true);
        void flyLane.offsetWidth;
        flyLane.classList.add('flying');
      }else if(mode==='flies'){
        refs.fly.setAnimation('flies',true);
        void flyLane.offsetWidth;
        flyLane.classList.add('flying');
      }else if(mode==='flies_Run'){
        refs.fly.setAnimation('flies_Run',true);
        void flyLane.offsetWidth;
        flyLane.classList.add('flying','fast');
      }else{
        refs.fly.setAnimation(mode,false);
      }
    }

    flyBob.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      if(!enabled('fly')||!ready.fly) return;
      const wasFast=flyLane.classList.contains('fast');
      refs.fly.setAnimation('fire',false);
      setTimeout(()=>{
        if(!enabled('fly')) return;
        refs.fly.setAnimation(wasFast?'flies_Run':'flies',true);
      },900);
    });

    function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
    function once(player,name){
      return new Promise(resolve=>{
        const entry=player.animationState.setAnimation(0,name,false);
        entry.listener={complete:resolve};
      });
    }

    async function startCroc(){
      if(!ready.croc) return;
      const token=++crocToken;
      crocActor.classList.add('on');
      const width=Math.max(520,crocActor.getBoundingClientRect().width);
      const left=-width*.72;
      const right=innerWidth-width*.40;

      while(token===crocToken && enabled('croc')){
        crocActor.classList.remove('reverse');
        crocActor.style.transition='none';
        crocActor.style.left=left+'px';
        refs.croc.setAnimation('running',true);
        await sleep(60);

        if(token!==crocToken||!enabled('croc')) break;
        crocActor.style.transition='left 4.6s linear, transform .2s, opacity .2s';
        crocActor.style.left=right+'px';
        await sleep(4600);

        if(token!==crocToken||!enabled('croc')) break;
        await once(refs.croc,Math.random()>.5?'Happy_1':'Happy_2');

        if(token!==crocToken||!enabled('croc')) break;
        crocActor.classList.add('reverse');
        refs.croc.setAnimation('running',true);
        crocActor.style.left=left+'px';
        await sleep(4600);

        if(token!==crocToken||!enabled('croc')) break;
        await once(refs.croc,Math.random()>.5?'Happy_1':'Happy_2');

        if(token!==crocToken||!enabled('croc')) break;
        crocActor.classList.remove('reverse');
        await once(refs.croc,'start');
        await sleep(250);
      }
    }
  </script>
</body>
</html>
