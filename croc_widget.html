<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crocodile Demo</title>
<link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.3.*/dist/spine-player.css">
<script src="https://unpkg.com/@esotericsoftware/spine-player@4.3.*/dist/iife/spine-player.js"></script>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:visible;
  background:transparent;
}
#crocPlayer{
  position:absolute;
  inset:0;
  background:transparent!important;
  overflow:visible!important;
}
#crocPlayer canvas{
  background:transparent!important;
}
</style>
</head>
<body>
<div id="crocPlayer"></div>
<script>
let playerRef = null;
let ready = false;

function tell(type, extra = {}) {
  try {
    parent.postMessage({ source:'vahram-croc-v18', type, ...extra }, '*');
  } catch (_) {}
}

function playAnimation(name, loop) {
  if (!ready || !playerRef) return;
  try {
    playerRef.animationState.setAnimation(0, name, !!loop);
  } catch (e) {
    console.error('CROC play error:', e);
  }
}

new spine.SpinePlayer('crocPlayer', {
  skeleton:'assets/spine/croc/kroks spine fayl.json',
  atlas:'assets/spine/croc/kroks spine fayl.atlas',
  animation:'start',
  showControls:false,
  alpha:true,
  premultipliedAlpha:true,
  backgroundColor:'#00000000',
  defaultMix:0.08,
  viewport:{
    x:-1012.6289,
    y:-1440.6956,
    width:2083.2205,
    height:2592.464,
    padLeft:0,
    padRight:0,
    padTop:0,
    padBottom:0
  },
  success(player) {
    playerRef = player;
    ready = true;

    try {
      player.animationState.clearTracks();
      player.animationState.addListener({
        complete(entry) {
          const name = entry && entry.animation ? entry.animation.name : '';
          if (name) tell('complete', { name });
        }
      });
    } catch (e) {
      console.error('CROC listener error:', e);
    }

    tell('ready');
  },
  error(player, reason) {
    console.error('Crocodile Spine error:', reason);
    tell('error', { reason:String(reason || 'unknown') });
  }
});

window.addEventListener('message', (event) => {
  const d = event.data || {};
  if (d.source !== 'vahram-site-croc-v18') return;

  if (d.type === 'play') {
    playAnimation(d.name, d.loop);
  }

  if (d.type === 'stop') {
    try {
      if (playerRef && playerRef.animationState) {
        playerRef.animationState.clearTracks();
      }
    } catch (_) {}
  }
});
</script>
</body>
</html>
